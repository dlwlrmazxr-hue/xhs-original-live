name: XHSOriginalLive
options:
  bundleIdPrefix: local.originallive
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: 1,2
    CODE_SIGN_STYLE: Automatic
targets:
  XHSOriginalLive:
    type: application
    platform: iOS
    sources:
    - DownloadService.swift
    - Intents.swift
    - Models.swift
    - MoviePairer.swift
    - Network.swift
    - NoteResolver.swift
    - OriginalImage.swift
    - OriginalLiveApp.swift
    - PhotoStore.swift
    - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 原图实况
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: 0.2.3
        CFBundleVersion: '6'
        NSPhotoLibraryAddUsageDescription: 将你选择下载的图片、视频和原图实况照片保存到系统相册。
        UILaunchScreen: {}
        CFBundleURLTypes:
        - CFBundleURLName: local.originallive.download
          CFBundleURLSchemes:
          - originallive
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.originallive.xhs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
  XHSOriginalLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - CoreTests.swift
    dependencies:
    - target: XHSOriginalLive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  XHSOriginalLive:
    build:
      targets:
        XHSOriginalLive: all
    test:
      targets:
      - XHSOriginalLiveTests
